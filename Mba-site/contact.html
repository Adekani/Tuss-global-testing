<style>
  body {
    background-color: #FBF7F1;

  /* Fire gradient — signature animated accent */
  .fire-gradient {
    background: linear-gradient(135deg, #F0470A, #F8B400, #F0470A);
    background-size: 200% 200%;
    animation: fire-drift 10s ease infinite;
  }

  @keyframes fire-drift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Hero grand reveal */
  .hero-reveal-text {
    opacity: 0;
    transform: translateY(14px);
    animation: hero-text-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: 0.2s;
  }

  @keyframes hero-text-in {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero-reveal-text {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .fire-gradient {

</style>

<div id="footer-placeholder"></div>

<script>
  // Standard Dynamic Component Loader
  function loadComponent(id, file) {
    fetch(file)
      .then(response => {
        if (!response.ok) throw new Error("Component load error: " + response.status);
        return response.text();
      })
      .then(data => {
        document.getElementById(id).innerHTML = data;
        // Re-execute any <script> tags inside the loaded fragment —
        // innerHTML does not run them on its own.
        const scripts = document.getElementById(id).querySelectorAll("script");
        scripts.forEach(oldScript => {
          const newScript = document.createElement("script");
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
        console.log("[MBisAfrican] " + file + " loaded successfully into #" + id);
      })
      .catch(error => console.error("[MBisAfrican] Error loading " + file + " into #" + id + ":", error));
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadComponent('header-placeholder', 'header.html');
    loadComponent('footer-placeholder', 'footer.html');
  });
</script>

</body>
